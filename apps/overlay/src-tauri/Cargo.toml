[package]
name = "overlay"
version = "0.1.0"
description = "AgenticEngine macOS overlay"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
